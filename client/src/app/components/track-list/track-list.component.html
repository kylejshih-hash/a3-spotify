@if(tracks) {
	<table class="table table-sm table-light table-striped">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Track</th>
				<th scope="col">Duration</th>
				@if(!hideArtist) {
					<th scope="col">Primary Artist</th>
				}
				@if(!hideAlbum) {
					<th scope="col">Album</th>
				}
			</tr>
		</thead>
		<tbody>
			@for(t of tracks; track $index; let i = $index) {
				<tr>
					<td>{{ i + 1 }}</td>
					<td>
						<a [routerLink]="['/track', t.id]">{{ t.name }}</a>
					</td>
					<td>{{ t.durationStr }}</td>
					@if(!hideArtist) {
						<td><a [routerLink]="['/artist', t.artists[0].id]">{{ t.artists[0].name }}</a></td>
					}
					@if(!hideAlbum) {
						<td><a [routerLink]="['/album', t.album.id]">{{ t.album.name }}</a></td>
					}
				</tr>
			}
		</tbody>
	</table>
}
